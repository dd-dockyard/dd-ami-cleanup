[project]
name = "dd-ami-cleanup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.0"
dependencies = ["boto3>=1.43.87", "botocore>=1.43.87", "rich>=14.0.0", "typer>=0.16.0"]

[project.scripts]
dd-podman-build = "dd_ami_cleanup.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.pyright]
pythonVersion = "3.13"
include = ["src"]

reportImportCycles = true
reportUnnecessaryTypeIgnoreComment = true

[tool.ruff]
respect-gitignore = true

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]
